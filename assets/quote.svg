<text x="30" y="88" font-family="Georgia,'Times New Roman',serif" font-size="72" fill="#C98A72" fill-opacity=".35">“</text><text x="80" y="70" font-family="Georgia,'Times New Roman',serif" font-style="italic" font-size="23" fill="#3F3533">The details are not the details. They make</text><text x="80" y="102" font-family="Georgia,'Times New Roman',serif" font-style="italic" font-size="23" fill="#3F3533">the design.</text><line x1="80" y1="142" x2="108" y2="142" stroke="#C98A72" stroke-width="2"/><text x="118" y="147" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#7A5C48" text-anchor="start" letter-spacing="0" >Charles Eames</text></svg>