name: Update GOT PR stats

on:
  workflow_dispatch:
  schedule:
    - cron: '17 0 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate merged PR card
        env:
          GOT_REPO_TOKEN: ${{ secrets.GOT_REPO_TOKEN }}
        run: node scripts/update-got-pr-stats.js
      - name: Commit updated card
        run: |
          git add got-pr-stats.svg
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Update GOT merged PR stats' || echo 'No changes'
          git push
